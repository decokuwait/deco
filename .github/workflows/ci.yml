name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_ROOT_DOMAIN: localhost:3000
      SUPER_ADMIN_EMAILS: owner@example.com
      SUPER_ADMIN_PASSWORD: Owner123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (routing, proxy, attribution, marketing payloads, database on PGlite, registry, rendering of all 60 templates)
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke test (production server, tenant routing, tracking APIs, auth guards, admin pages)
        run: npm run smoke
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end flows (visitor, admin, super admin)
        run: npm run e2e
      - name: Visual sweep (browser errors, horizontal overflow, controls outside the viewport)
        # A fixed four-code sample left 56 templates unchecked. Pull requests keep the quick sample;
        # pushes to main sweep every template, which is where regressions were slipping through.
        run: npm run shots
        env:
          SHOTS_STRICT: "1"
          SHOTS_SKIP_ADMIN: "1"
          SHOTS_ONLY: ${{ github.event_name == 'pull_request' && '101,207,313,409' || '' }}
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: |
            .qa/e2e
            .qa/shots
          if-no-files-found: ignore

  postgres:
    # The production data path (postgres.js, jsonb passthrough, pooled multi-statement migrations) runs
    # against a real Postgres, not only the embedded PGlite used by the default unit tests.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deco
          POSTGRES_PASSWORD: deco
          POSTGRES_DB: deco
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://deco:deco@localhost:5432/deco
      DATABASE_URL: postgres://deco:deco@localhost:5432/deco
      NEXT_PUBLIC_ROOT_DOMAIN: localhost:3000
      SUPER_ADMIN_EMAILS: owner@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations (twice: the second run must be a no-op)
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: Database and security suites on Postgres
        # db-health covers runMigrations, which is the step that behaves differently on a real Postgres:
        # postgres.js rejects a BEGIN it did not issue itself, so the migration path only breaks here.
        run: npx vitest run tests/db.test.ts tests/security.test.ts tests/db-health.test.ts
